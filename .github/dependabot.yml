# Dependabot: weekly PRs for outdated / vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/AgentFw/AgentFw"
      - "/AgentFw/AgentFw.Tests"
    schedule:
      interval: "weekly"
    groups:
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
          - "EFCore.*"
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      test-tools:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Testcontainers*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
